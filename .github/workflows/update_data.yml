name: AI Stock V3 Daily Automator

on:
  schedule:
    # 每天台股盤後自動執行 (可依需求調整時間)
    - cron: '0 9 * * 1-5'
  workflow_dispatch: # 支援手動按鈕觸發

jobs:
  build-and-predict:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 步驟一：拉取最新程式碼
        uses: actions/checkout@v3

      - name: 🐍 步驟二：設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 步驟三：安裝所需套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xgboost openai finmind requests lightgbm matplotlib

      - name: 🤖 步驟四：執行 V3/V4 全套量化與 AI 產線
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "1. 抓取外部產業與籌碼資料..."
          python scripts/fetch_dram.py
          python scripts/fetch_whales.py
          
          echo "2. 訓練與更新 XGBoost AI 大腦..."
          python scripts/train_xgb_v3.py
          
          echo "3. 呼叫 OpenAI 進行新聞與網格分析..."
          python scripts/news_sentiment_ai_v3.py
          python scripts/strategy_grid_ai_v3.py
          python scripts/ai_analyst_v3.py
          
          # 👇 【新加這行】呼叫 V4 AI 投資長判決
          echo "🌟 呼叫 V4 AI 投資長進行終極判決..."
          python scripts/ultimate_judge_ai_v4.py
          
          echo "4. 進行數據大一統打包 (給前端網頁用)..."
          python scripts/build_data.py 2408
          
          echo "5. 啟動黑天鵝防禦與 Discord/TG 推播..."
          python scripts/alert_system_v3.py

      # 👇 【新加這個步驟】把機器人算好的新資料 Commit 並 Push 回 GitHub，讓網頁讀取！
      - name: 📤 步驟五：將最新 AI 數據與判決自動 Commit 並 Push 上雲端
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ data_db/
          git commit -m "🤖 [Automated] 每日盤後數據與 V4 AI 判決自動更新 [skip ci]" || echo "無資料變更"
          git push