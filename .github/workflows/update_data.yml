name: AI Stock Daily Pipeline

on:
  schedule:
    # 亞洲/台股收盤：台灣時間 15:00，週一至週五 (UTC 07:00)
    - cron: "0 7 * * 1-5"
    # 美股收盤/盤後：台灣時間 06:00，週二至週六 (UTC 22:00，對應美國週一至週五)
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-stock-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      STOCK_LIST: ${{ vars.STOCK_LIST || '2408,2344,2337,4973,6770' }}
      DRAM_DATA_URL: ${{ secrets.DRAM_DATA_URL }}
      DRAM_LATEST_DATE: ${{ vars.DRAM_LATEST_DATE }}
      DRAM_LATEST_8GB_PRICE: ${{ secrets.DRAM_LATEST_8GB_PRICE }}
      DRAM_LATEST_4GB_PRICE: ${{ secrets.DRAM_LATEST_4GB_PRICE }}
      DRAM_DATA_SOURCE: ${{ vars.DRAM_DATA_SOURCE || 'configured verified source' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Static validation
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -v
          node --check docs/app.js

      - name: Initialize database schema
        run: python scripts/db_manager.py

      - name: Build Global Data and News
        run: python scripts/build_global_data.py

      - name: Refresh market, fundamentals, news, and base frontend data
        run: python scripts/build_data.py

      - name: Import verified DRAM data when configured
        run: python scripts/fetch_dram.py

      - name: Build clearly-labeled position proxy scores
        run: python scripts/fetch_whales.py

      - name: Train independent per-stock XGBoost models
        run: python scripts/train_xgb_v3.py

      - name: Generate current XGBoost predictions
        run: python scripts/predict_today_v3.py

      - name: Generate structured news and quant reports
        run: |
          python scripts/news_sentiment_ai_v3.py
          python scripts/strategy_grid_ai_v3.py
          python scripts/ai_analyst_v3.py

      - name: Run relative-risk alerts
        run: python scripts/alert_system_v3.py

      - name: Generate deterministic signal fusion
        run: python scripts/ultimate_judge_ai_v4.py

      - name: Inject model and report outputs into frontend JSON
        run: python scripts/build_data.py --refresh-v3-only

      - name: Re-run static validation after generation
        run: |
          python -m compileall -q scripts
          node --check docs/app.js

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data_db
          if git diff --cached --quiet; then
            echo "No generated data changes"
            exit 0
          fi
          git commit -m "chore(data): daily AI Stock update [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"